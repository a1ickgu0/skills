<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="814" viewBox="0 0 1320 814" role="img" aria-labelledby="title desc" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif">
<title id="title">Aruba CX 产品全景图：八型号布局示例</title>
<desc id="desc">基于Aruba研究输入的独立示例。按接口形态分层，突出气流、电源和TAA名称标注，不代表完整目录或官方认证结论。</desc>
<rect width="1320" height="814" fill="#f4f6f9"/>
<text x="28" y="42" font-size="28" fill="#26324b" font-weight="700">Aruba CX 产品全景图</text>
<text x="28" y="72" font-size="16" fill="#26324b" font-weight="400">8款研究输入示例 · 按接口能力分层，非部署层级或性能排名 · 非全量官方核验</text>
<text x="28" y="98" font-size="14" fill="#59677b" font-weight="400">读图：卡片头为SKU/子平台；正文为共同能力；末两行为采购差异与限制。</text>
